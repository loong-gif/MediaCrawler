name: Weibo Creator Schedule

"on":
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weibo-schedule
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Weibo creator crawl
        env:
          WEIBO_COOKIES: ${{ secrets.WEIBO_COOKIES }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: >
          uv run main.py
          --platform wb
          --lt cookie
          --type creator
          --save_data_option supabase
          --cookies "${WEIBO_COOKIES}"
